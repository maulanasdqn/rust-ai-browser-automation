[workspace]
resolver = "2"
members = [
  "automation-api", 
  "automation-browser",
  "automation-integration",
  "automation-ui",
  "automation-ai"
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
thirtyfour = "0.31"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
opencv = "0.88"     
image = "0.25"      
anyhow = "1.0"
rmcp = { version = "0.1", features = ["server", "client", "transport-io", "transport-child-process"] }
uuid = { version = "1.0", features = ["v4"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors"] }
askama = { version = "0.12", features = ["with-axum"] }
openrouter-rs = "0.4.4"
futures-util = "0.3"
dotenvy = "0.15"
