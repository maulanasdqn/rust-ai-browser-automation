[package]
name = "automation-browser"
version = "0.1.0"
edition = "2021"

[dependencies]
automation-api = { path = "../automation-api" }
anyhow = "1.0"
thirtyfour = "0.34"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
reqwest = { version = "0.11", features = ["json"] }
regex = "1.0"
